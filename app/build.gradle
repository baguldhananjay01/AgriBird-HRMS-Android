plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.agribird.hrmsapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.agribird.hrmsapp"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ================================
    // Build Features
    // ================================
    buildFeatures {
        dataBinding true
        viewBinding true
    }

    // ================================
    // Build Types
    // ================================
    buildTypes {
        release {
            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    // ================================
    // Java Compatibility
    // ================================
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    // ================================
    // AndroidX Core & UI
    // ================================

    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.vectordrawable


    // ================================
    // Lifecycle
    // ================================

    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx


    // ================================
    // Material Design
    // ================================

    implementation 'com.google.android.material:material:1.13.0'


    // ================================
    // MPAndroidChart
    // ================================

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'


    // ================================
    // Bottom Navigation
    // ================================

    implementation 'com.github.simformsolutions:SSCustomBottomNavigation:3.6'

    implementation 'com.github.qamarelsafadi:CurvedBottomNavigation:0.1.3'


    // ================================
    // Google Play Services - Location
    // ================================

    implementation 'com.google.android.gms:play-services-location:21.3.0'


    // ================================
    // UI Scroll Decor
    // ================================

    implementation 'io.github.everythingme:overscroll-decor-android:1.1.1'


    // ================================
    // CameraX
    // ================================

    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'


    // ================================
    // ML Kit - Face Detection
    // ================================

    implementation 'com.google.mlkit:face-detection:16.1.7'


    // ================================
    // Room Database
    // ================================

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'


    // ================================
    // Navigation Component
    // ================================

    implementation 'androidx.navigation:navigation-fragment:2.8.8'
    implementation 'androidx.navigation:navigation-ui:2.8.8'


    // ================================
    // Retrofit & Gson
    // ================================

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'


    // ================================
    // SDP / SSP
    // ================================

    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'


    // ================================
    // Testing
    // ================================

    testImplementation libs.junit

    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}